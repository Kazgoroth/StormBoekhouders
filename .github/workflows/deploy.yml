name: Deploy naar one.com
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload via SFTP
        env:
          HOST: ${{ secrets.ONECOM_HOST }}
          USER: ${{ secrets.ONECOM_USER }}
          PASS: ${{ secrets.ONECOM_PASSWORD }}
        run: |
          sudo apt-get install -y lftp
          lftp -u "$USER","$PASS" sftp://$HOST -e "set sftp:auto-confirm yes; mirror -R --verbose --exclude '^\.git' --exclude README.md ./ www/; bye"
